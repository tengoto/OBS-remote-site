<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OBS Remote Hotkeys</title>

<style>
    body {
        font-family: sans-serif;
        padding: 30px;
    }

    input {
        width: 400px;
        padding: 8px;
        margin-bottom: 10px;
    }

    button {
        width: 70px;
        height: 50px;
        margin: 4px;
        font-size: 20px;
    }

    #status {
        margin-top: 20px;
    }
</style>
</head>

<body>

<h2>OBS Remote Hotkeys</h2>

<div>
    <input id="url"
        type="text"
        value="wss://YOUR-DOMAIN.example.com">
</div>

<div>
    <input id="password"
        type="password"
        placeholder="OBS WebSocket Password">
</div>

<button onclick="connect()">接続</button>

<div id="buttons"></div>

<div id="status">未接続</div>

<script>
let ws = null;
let identified = false;
let requestId = 0;

const keys = [
    ["6", "OBS_KEY_6"],
    ["7", "OBS_KEY_7"],
    ["8", "OBS_KEY_8"],
    ["9", "OBS_KEY_9"],
    ["0", "OBS_KEY_0"],
    ["-", "OBS_KEY_MINUS"]
];

const buttons = document.getElementById("buttons");

for (const [label, keyId] of keys) {
    const button = document.createElement("button");
    button.textContent = label;
    button.onclick = () => triggerHotkey(keyId);
    buttons.appendChild(button);
}

document.addEventListener("keydown", (event) => {
    const tag = document.activeElement?.tagName;

    if (tag === "INPUT" || tag === "TEXTAREA") {
        return;
    }

    const keyMap = {
        "6": "OBS_KEY_6",
        "7": "OBS_KEY_7",
        "8": "OBS_KEY_8",
        "9": "OBS_KEY_9",
        "0": "OBS_KEY_0",
        "-": "OBS_KEY_MINUS"
    };

    const keyId = keyMap[event.key];

    if (!keyId) {
        return;
    }

    event.preventDefault();
    triggerHotkey(keyId);
});

function connect() {
    const url = document.getElementById("url").value;
    const password = document.getElementById("password").value;

    ws = new WebSocket(url);

    ws.onopen = () => {
        document.getElementById("status").textContent =
            "WebSocket接続中";
    };

    ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        if (msg.op === 0) {
            const hello = msg.d;

            let auth = undefined;

            if (hello.authentication) {
                const encoder = new TextEncoder();

                const secret = await crypto.subtle.digest(
                    "SHA-256",
                    encoder.encode(
                        password + hello.authentication.salt
                    )
                );

                const secretBase64 =
                    arrayBufferToBase64(secret);

                const authHash = await crypto.subtle.digest(
                    "SHA-256",
                    encoder.encode(
                        secretBase64 +
                        hello.authentication.challenge
                    )
                );

                auth =
                    arrayBufferToBase64(authHash);
            }

            ws.send(JSON.stringify({
                op: 1,
                d: {
                    rpcVersion: 1,
                    authentication: auth
                }
            }));
        }

        if (msg.op === 2) {
            identified = true;

            document.getElementById("status").textContent =
                "OBS接続完了";
        }
    };

    ws.onerror = () => {
        document.getElementById("status").textContent =
            "接続エラー";
    };

    ws.onclose = () => {
        identified = false;

        document.getElementById("status").textContent =
            "切断";
    };
}

function triggerHotkey(keyId) {
    if (!ws || !identified) {
        alert("OBSに接続されていません");
        return;
    }

    requestId++;

    ws.send(JSON.stringify({
        op: 6,
        d: {
            requestType: "TriggerHotkeyByKeySequence",
            requestId: String(requestId),
            requestData: {
                keyId: keyId,
                keyModifiers: {
                    shift: false,
                    control: false,
                    alt: false,
                    command: false
                }
            }
        }
    }));
}

function arrayBufferToBase64(buffer) {
    let binary = "";
    const bytes = new Uint8Array(buffer);

    for (const byte of bytes) {
        binary += String.fromCharCode(byte);
    }

    return btoa(binary);
}
</script>

</body>
</html>
